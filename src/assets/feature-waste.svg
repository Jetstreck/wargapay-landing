<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft Eco Light Background Gradient -->
    <linearGradient id="wasteLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF7" />
      <stop offset="100%" stop-color="#EDF2E8" />
    </linearGradient>

    <!-- Olive Green Primary Bin Gradient (#607C3C) -->
    <linearGradient id="binOlive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#739448" />
      <stop offset="100%" stop-color="#607C3C" />
    </linearGradient>

    <!-- Anorganik Soft Blue Bin -->
    <linearGradient id="binBlueLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Residu Warm Amber Bin -->
    <linearGradient id="binAmberLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Flat Elements -->
    <filter id="softCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#607C3C" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Off-white/Cream Background -->
  <rect width="800" height="600" rx="24" fill="url(#wasteLightBg)" />

  <!-- Soft Ambient Sun/Eco Ring -->
  <circle cx="400" cy="300" r="230" fill="#607C3C" fill-opacity="0.08" />

  <!-- Ground Platform Shadow -->
  <ellipse cx="400" cy="485" rx="310" ry="20" fill="#607C3C" fill-opacity="0.08" />

  <!-- Floating Eco Leaves in Background Layer -->
  <g fill="#85A359" opacity="0.4">
    <path d="M 160 150 C 135 120 175 100 205 110 C 225 140 195 170 160 150 Z" />
    <path d="M 640 170 C 670 140 690 180 680 210 C 650 230 620 200 640 170 Z" />
  </g>

  <!-- Central Recycle Arrow Watermark -->
  <g transform="translate(400, 200) scale(0.7)" fill="none" stroke="#607C3C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.15">
    <path d="M -70 40 L 0 -80 L 70 40 Z" stroke-dasharray="16 12" />
  </g>

  <!-- ==================== BIN 1: ANORGANIK (BLUE - LEFT) ==================== -->
  <g transform="translate(190, 240)" filter="url(#softCardShadow)">
    <polygon points="20,50 120,50 110,210 30,210" fill="url(#binBlueLight)" />
    <rect x="12" y="38" width="116" height="16" rx="8" fill="#1D4ED8" />
    <rect x="46" y="24" width="48" height="16" rx="6" fill="#93C5FD" />
    <!-- Recycle Symbol -->
    <g transform="translate(70, 130) scale(0.65)" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -36 L 28 16 H -28 Z" />
      <path d="M 12 16 L 28 16 L 20 2" />
      <path d="M -20 -10 L -28 -24 L -12 -24" />
      <path d="M 16 -18 L 28 -2" />
    </g>
    <text x="70" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="1">ANORGANIK</text>
  </g>

  <!-- ==================== BIN 2: ORGANIK (OLIVE GREEN #607C3C - HERO CENTER) ==================== -->
  <g transform="translate(325, 200)" filter="url(#softCardShadow)">
    <polygon points="22,60 128,60 118,250 32,250" fill="url(#binOlive)" />
    <rect x="14" y="46" width="122" height="18" rx="9" fill="#4B622E" />
    <rect x="50" y="30" width="50" height="18" rx="7" fill="#A3C579" />
    <!-- Leaf Symbol -->
    <g transform="translate(75, 145) scale(0.9)">
      <path d="M 0 35 C -24 35 -35 15 -35 -10 C -35 -35 0 -50 0 -50 C 0 -50 35 -35 35 -10 C 35 15 24 35 0 35 Z" fill="#ffffff" />
      <path d="M 0 25 V -35" stroke="#4B622E" stroke-width="4" stroke-linecap="round" />
      <path d="M 0 5 Q 12 -5 18 -15" stroke="#4B622E" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 0 -5 Q -12 -15 -18 -25" stroke="#4B622E" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
    <text x="75" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="15" text-anchor="middle" letter-spacing="1.5">ORGANIK</text>
  </g>

  <!-- ==================== BIN 3: RESIDU (AMBER - RIGHT) ==================== -->
  <g transform="translate(470, 240)" filter="url(#softCardShadow)">
    <polygon points="20,50 120,50 110,210 30,210" fill="url(#binAmberLight)" />
    <rect x="12" y="38" width="116" height="16" rx="8" fill="#B45309" />
    <rect x="46" y="24" width="48" height="16" rx="6" fill="#FDE68A" />
    <!-- Can Icon -->
    <g transform="translate(70, 130) scale(0.65)" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M -18 -20 H 18" />
      <path d="M -6 -20 V -28 H 6 V -20" />
      <path d="M -14 -20 L -10 24 H 10 L 14 -20" />
      <line x1="-5" y1="-10" x2="-4" y2="15" />
      <line x1="5" y1="-10" x2="4" y2="15" />
    </g>
    <text x="70" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="1">RESIDU</text>
  </g>

  <!-- Foreground Eco Green Leaves (#607C3C) -->
  <g fill="#607C3C" opacity="0.9">
    <path d="M 280 435 C 260 415 270 395 290 400 C 305 415 295 440 280 435 Z" />
    <path d="M 530 425 C 550 405 540 385 520 390 C 505 405 515 430 530 425 Z" />
  </g>
</svg>