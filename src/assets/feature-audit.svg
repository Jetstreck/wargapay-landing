<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft Eco Light Background Gradient -->
    <linearGradient id="auditLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF7" />
      <stop offset="100%" stop-color="#EDF2E8" />
    </linearGradient>

    <!-- Olive Cover Gradient (#607C3C) -->
    <linearGradient id="oliveCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#739448" />
      <stop offset="100%" stop-color="#607C3C" />
    </linearGradient>

    <filter id="auditSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#607C3C" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Clean Off-White Background -->
  <rect width="800" height="600" rx="24" fill="url(#auditLightBg)" />

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="300" r="230" fill="#607C3C" fill-opacity="0.08" />

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="490" rx="300" ry="22" fill="#607C3C" fill-opacity="0.08" />

  <!-- ==================== MAIN OPEN LEDGER NOTEBOOK ==================== -->
  <g transform="translate(180, 160)" filter="url(#auditSoftShadow)">
    <!-- Ledger Hardcover Base (#607C3C Olive) -->
    <rect x="-10" y="-8" width="460" height="296" rx="20" fill="url(#oliveCover)" />
    <!-- Spine -->
    <rect x="214" y="-8" width="12" height="296" fill="#4B622E" />

    <!-- Left Page -->
    <rect x="6" y="8" width="210" height="264" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <!-- Right Page -->
    <rect x="224" y="8" width="210" height="264" rx="12" fill="#FAFAF8" stroke="#E2E8F0" stroke-width="1" />

    <!-- Left Page Content: Transparansi Kas RT -->
    <g transform="translate(24, 28)">
      <rect x="0" y="0" width="70" height="18" rx="6" fill="#EDF2E8" />
      <text x="35" y="13" fill="#607C3C" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">BUKU KAS RT</text>

      <text x="0" y="42" fill="#1A2518" font-family="system-ui, sans-serif" font-weight="800" font-size="13">Arus Kas Warga 2026</text>
      <text x="0" y="58" fill="#5A6B52" font-family="system-ui, sans-serif" font-size="10">Audit real-time &amp; transparan</text>

      <!-- Ledger Table Rows -->
      <line x1="0" y1="74" x2="175" y2="74" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="0" y="92" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Kas Masuk IPL</text>
      <text x="175" y="92" fill="#607C3C" font-family="monospace" font-weight="700" font-size="11" text-anchor="end">+Rp 24,8 Jt</text>

      <line x1="0" y1="104" x2="175" y2="104" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="0" y="122" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Gaji Satpam &amp; Ops</text>
      <text x="175" y="122" fill="#DC2626" font-family="monospace" font-weight="700" font-size="11" text-anchor="end">-Rp 8,5 Jt</text>

      <line x1="0" y1="134" x2="175" y2="134" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="0" y="152" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Truk Sampah RT</text>
      <text x="175" y="152" fill="#DC2626" font-family="monospace" font-weight="700" font-size="11" text-anchor="end">-Rp 3,2 Jt</text>

      <line x1="0" y1="164" x2="175" y2="164" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="0" y="182" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Perbaikan Lampu</text>
      <text x="175" y="182" fill="#DC2626" font-family="monospace" font-weight="700" font-size="11" text-anchor="end">-Rp 650 Rb</text>

      <!-- Saldo Akhir Pill -->
      <rect x="0" y="196" width="175" height="34" rx="8" fill="#F4F6F0" stroke="#E0E6D8" stroke-width="1.5" />
      <text x="10" y="217" fill="#5A6B52" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SALDO KAS:</text>
      <text x="165" y="218" fill="#607C3C" font-family="monospace" font-weight="800" font-size="13" text-anchor="end">Rp 128,4 Jt</text>
    </g>

    <!-- Right Page Content: Chart & Bukti Kwitansi G-Drive -->
    <g transform="translate(244, 28)">
      <rect x="0" y="0" width="80" height="18" rx="6" fill="#EDF2E8" />
      <text x="40" y="13" fill="#607C3C" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">BUKTI GDRIVE</text>

      <text x="0" y="42" fill="#1A2518" font-family="system-ui, sans-serif" font-weight="800" font-size="13">Grafik &amp; Nota Kwitansi</text>
      <text x="0" y="58" fill="#5A6B52" font-family="system-ui, sans-serif" font-size="10">Bukti nota terunggah otomatis</text>

      <!-- Mini Flat Bar Chart -->
      <g transform="translate(10, 80)">
        <rect x="0" y="40" width="22" height="40" rx="4" fill="#A3C579" />
        <rect x="32" y="25" width="22" height="55" rx="4" fill="#85A359" />
        <rect x="64" y="10" width="22" height="70" rx="4" fill="#607C3C" />
        <rect x="96" y="30" width="22" height="50" rx="4" fill="#739448" />
        <rect x="128" y="5" width="22" height="75" rx="4" fill="#4B622E" />
      </g>

      <!-- Verified Cloud Storage Badge Box -->
      <rect x="0" y="185" width="170" height="44" rx="10" fill="#FFFFFF" stroke="#E0E6D8" stroke-width="1.5" />
      <!-- Cloud Icon -->
      <path d="M 24 212 A 8 8 0 0 1 38 206 A 12 12 0 0 1 58 209 A 8 8 0 0 1 56 220 H 24 A 6 6 0 0 1 24 212 Z" fill="#607C3C" />
      <text x="66" y="205" fill="#1A2518" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Google Drive Sync</text>
      <text x="66" y="220" fill="#607C3C" font-family="system-ui, sans-serif" font-weight="600" font-size="10">100% Nota Terlampir</text>
    </g>
  </g>

  <!-- ==================== FLOATING SECURITY SHIELD BADGE ==================== -->
  <g transform="translate(560, 110)" filter="url(#auditSoftShadow)">
    <path d="M 45 10 L 80 25 V 55 C 80 80 45 98 45 98 C 45 98 10 80 10 55 V 25 Z" fill="#607C3C" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="45" cy="46" r="8" fill="#FFFFFF" />
    <polygon points="41,46 49,46 51,64 39,64" fill="#FFFFFF" />
    <path d="M 45 28 A 10 10 0 0 1 55 38 H 35 A 10 10 0 0 1 45 28 Z" fill="none" stroke="#FFFFFF" stroke-width="3" />
  </g>
</svg>