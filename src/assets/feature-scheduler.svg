<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft Eco Light Background Gradient -->
    <linearGradient id="schedLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF7" />
      <stop offset="100%" stop-color="#EDF2E8" />
    </linearGradient>

    <!-- Olive Calendar Header -->
    <linearGradient id="calOliveHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#556F35" />
      <stop offset="100%" stop-color="#607C3C" />
    </linearGradient>

    <filter id="schedSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#607C3C" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Clean Off-White Background -->
  <rect width="800" height="600" rx="24" fill="url(#schedLightBg)" />

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="300" r="230" fill="#607C3C" fill-opacity="0.08" />

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="500" rx="280" ry="20" fill="#607C3C" fill-opacity="0.08" />

  <!-- ==================== MAIN MINIMALIST WALL CALENDAR ==================== -->
  <g transform="translate(190, 130)" filter="url(#schedSoftShadow)">
    <rect width="280" height="320" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Binder Rings -->
    <rect x="50" y="-12" width="14" height="24" rx="7" fill="#94A3B8" />
    <rect x="133" y="-12" width="14" height="24" rx="7" fill="#94A3B8" />
    <rect x="216" y="-12" width="14" height="24" rx="7" fill="#94A3B8" />

    <!-- Calendar Header (#607C3C) -->
    <path d="M 0 20 C 0 9 9 0 20 0 H 260 C 271 0 280 9 280 20 V 65 H 0 Z" fill="url(#calOliveHeader)" />
    <text x="140" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="16" text-anchor="middle" letter-spacing="2">NOVEMBER 2026</text>

    <!-- Day Names Header Row -->
    <g transform="translate(14, 88)" fill="#64748B" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">
      <text x="18">SEN</text>
      <text x="54">SEL</text>
      <text x="90">RAB</text>
      <text x="126">KAM</text>
      <text x="162">JUM</text>
      <text x="198">SAB</text>
      <text x="234" fill="#EF4444">MIN</text>
    </g>

    <!-- Calendar Date Grid -->
    <g transform="translate(14, 110)">
      <!-- Row 1 -->
      <text x="18" y="20" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">27</text>
      <text x="54" y="20" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">28</text>
      <text x="90" y="20" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">29</text>
      <text x="126" y="20" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">30</text>
      <text x="162" y="20" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">1</text>
      <text x="198" y="20" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">2</text>
      <text x="234" y="20" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">3</text>

      <!-- Row 2: Sel (Truk Sampah) & Jum (Truk Sampah) -->
      <text x="18" y="58" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">4</text>
      <!-- Active Pickup Date 5 (#607C3C) -->
      <circle cx="54" cy="54" r="15" fill="#607C3C" />
      <text x="54" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">5</text>
      <text x="90" y="58" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">6</text>
      <text x="126" y="58" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">7</text>
      <!-- Active Pickup Date 8 (#607C3C) -->
      <circle cx="162" cy="54" r="15" fill="#607C3C" />
      <text x="162" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">8</text>
      <text x="198" y="58" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">9</text>
      <text x="234" y="58" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">10</text>

      <!-- Row 3: Tanggal 10/15 Billing IPL -->
      <text x="18" y="96" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">11</text>
      <!-- Date 12 Active Pickup -->
      <circle cx="54" cy="92" r="15" fill="#607C3C" />
      <text x="54" y="96" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">12</text>
      <text x="90" y="96" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">13</text>
      <text x="126" y="96" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">14</text>
      <!-- Active IPL Reminder Date 15 (Amber) -->
      <circle cx="162" cy="92" r="15" fill="#D97706" />
      <text x="162" y="96" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">15</text>
      <text x="198" y="96" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">16</text>
      <text x="234" y="96" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">17</text>
    </g>

    <!-- Legend Footer -->
    <g transform="translate(24, 260)">
      <circle cx="6" cy="6" r="5" fill="#607C3C" />
      <text x="18" y="9" fill="#5A6B52" font-family="system-ui, sans-serif" font-size="10">Pengambilan Sampah</text>
      <circle cx="6" cy="24" r="5" fill="#D97706" />
      <text x="18" y="27" fill="#5A6B52" font-family="system-ui, sans-serif" font-size="10">Jatuh Tempo IPL RT</text>
    </g>
  </g>

  <!-- ==================== MODERN MINIMALIST WALL CLOCK ==================== -->
  <g transform="translate(530, 210)" filter="url(#schedSoftShadow)">
    <circle cx="75" cy="75" r="75" fill="#FFFFFF" stroke="#607C3C" stroke-width="5" />
    <circle cx="75" cy="75" r="66" fill="#FAFAF8" />

    <!-- Clock Hour Marks -->
    <g stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round">
      <line x1="75" y1="18" x2="75" y2="26" />
      <line x1="132" y1="75" x2="124" y2="75" />
      <line x1="75" y1="132" x2="75" y2="124" />
      <line x1="18" y1="75" x2="26" y2="75" />
    </g>

    <!-- Hands (07:00 WIB) -->
    <line x1="75" y1="75" x2="48" y2="98" stroke="#1A2518" stroke-width="4.5" stroke-linecap="round" />
    <line x1="75" y1="75" x2="75" y2="34" stroke="#607C3C" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="75" cy="75" r="5" fill="#607C3C" />

    <!-- 07:00 WIB Badge -->
    <rect x="25" y="165" width="100" height="26" rx="13" fill="#607C3C" />
    <text x="75" y="182" fill="#FFFFFF" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">07:00 WIB</text>
  </g>

  <!-- Sync Loop Badge -->
  <g transform="translate(130, 190)" filter="url(#schedSoftShadow)">
    <circle cx="28" cy="28" r="28" fill="#607C3C" stroke="#FFFFFF" stroke-width="3" />
    <g transform="translate(28, 28) scale(0.65)" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M -16 0 A 16 16 0 1 1 14 8" />
      <path d="M 8 10 L 14 8 L 16 16" />
    </g>
  </g>
</svg>