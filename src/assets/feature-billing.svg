<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft Eco Light Background Gradient -->
    <linearGradient id="billLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF7" />
      <stop offset="100%" stop-color="#EDF2E8" />
    </linearGradient>

    <!-- Olive Header Gradient -->
    <linearGradient id="oliveHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#556F35" />
      <stop offset="100%" stop-color="#607C3C" />
    </linearGradient>

    <!-- Badge Olive Gradient -->
    <linearGradient id="oliveBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#739448" />
      <stop offset="100%" stop-color="#607C3C" />
    </linearGradient>

    <filter id="billSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#607C3C" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Clean Off-White Background -->
  <rect width="800" height="600" rx="24" fill="url(#billLightBg)" />

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="300" r="230" fill="#607C3C" fill-opacity="0.08" />

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="510" rx="240" ry="20" fill="#607C3C" fill-opacity="0.09" />

  <!-- Smartphone Frame Silhouette (Subtle Soft Border) -->
  <rect x="250" y="80" width="300" height="420" rx="36" fill="#FFFFFF" stroke="#E0E6D8" stroke-width="3" opacity="0.85" />
  <rect x="360" y="96" width="80" height="6" rx="3" fill="#CBD5E1" />

  <!-- ==================== MAIN RECEIPT SHEET ==================== -->
  <g transform="translate(265, 110)" filter="url(#billSoftShadow)">
    <!-- White Crisp Flat Receipt Paper -->
    <path d="
      M 0 16 
      C 0 7 7 0 16 0 
      H 254 
      C 263 0 270 7 270 16 
      V 350 
      L 255 340 L 240 350 L 225 340 L 210 350 L 195 340 L 180 350 
      L 165 340 L 150 350 L 135 340 L 120 350 L 105 340 L 90 350 
      L 75 340 L 60 350 L 45 340 L 30 350 L 15 340 L 0 350 
      Z" 
      fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Receipt Header Bar (#607C3C Olive) -->
    <rect x="0" y="0" width="270" height="52" rx="16" fill="url(#oliveHeader)" />
    <text x="135" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="2">TAGIHAN IPL RESMI</text>

    <!-- Meta Details -->
    <text x="24" y="84" fill="#64748B" font-family="monospace" font-size="11">NO: INV/WP/2026/04</text>
    <text x="246" y="84" fill="#64748B" font-family="monospace" font-size="11" text-anchor="end">BLOK B2 - 14</text>
    <line x1="24" y1="98" x2="246" y2="98" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Line Items -->
    <g transform="translate(24, 120)">
      <text x="0" y="0" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Iuran Sampah &amp; Kebersihan</text>
      <text x="222" y="0" fill="#1A2518" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="end">Rp 65.000</text>

      <text x="0" y="28" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Keamanan Lingkungan</text>
      <text x="222" y="28" fill="#1A2518" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="end">Rp 75.000</text>

      <text x="0" y="56" fill="#334155" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Dana Kas Sosial RT</text>
      <text x="222" y="56" fill="#1A2518" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="end">Rp 20.000</text>
    </g>

    <line x1="24" y1="205" x2="246" y2="205" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Total Highlight Bar -->
    <rect x="20" y="218" width="230" height="42" rx="10" fill="#F4F6F0" stroke="#E0E6D8" stroke-width="1" />
    <text x="34" y="244" fill="#5A6B52" font-family="system-ui, sans-serif" font-weight="700" font-size="12">TOTAL IPL:</text>
    <text x="236" y="245" fill="#607C3C" font-family="system-ui, sans-serif" font-weight="800" font-size="16" text-anchor="end">Rp 160.000</text>

    <!-- Barcode at Bottom -->
    <g transform="translate(45, 280)" fill="#475569">
      <rect x="0" y="0" width="3" height="30" />
      <rect x="6" y="0" width="6" height="30" />
      <rect x="16" y="0" width="2" height="30" />
      <rect x="22" y="0" width="5" height="30" />
      <rect x="31" y="0" width="3" height="30" />
      <rect x="38" y="0" width="8" height="30" />
      <rect x="50" y="0" width="4" height="30" />
      <rect x="58" y="0" width="2" height="30" />
      <rect x="64" y="0" width="7" height="30" />
      <rect x="75" y="0" width="3" height="30" />
      <rect x="82" y="0" width="5" height="30" />
      <rect x="91" y="0" width="2" height="30" />
      <rect x="97" y="0" width="6" height="30" />
      <rect x="107" y="0" width="3" height="30" />
      <rect x="114" y="0" width="5" height="30" />
      <rect x="123" y="0" width="7" height="30" />
      <rect x="134" y="0" width="2" height="30" />
      <rect x="140" y="0" width="5" height="30" />
      <rect x="149" y="0" width="8" height="30" />
      <rect x="161" y="0" width="4" height="30" />
      <rect x="169" y="0" width="3" height="30" />
      <rect x="176" y="0" width="4" height="30" />
    </g>
  </g>

  <!-- ==================== CHECKMARK BADGE (LUNAS / OLIVE GREEN) ==================== -->
  <g transform="translate(490, 320)" filter="url(#billSoftShadow)">
    <circle cx="45" cy="45" r="45" fill="url(#oliveBadge)" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 28 45 L 39 56 L 62 33" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- LUNAS Pill Tag -->
    <rect x="-8" y="75" width="106" height="28" rx="14" fill="#4B622E" stroke="#FFFFFF" stroke-width="2" />
    <text x="45" y="94" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">LUNAS / PAID</text>
  </g>

  <!-- Notification Bell Badge Top-Left -->
  <g transform="translate(170, 180)" filter="url(#billSoftShadow)">
    <circle cx="28" cy="28" r="28" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
    <path d="M 28 17 C 23 17 20 20 20 25 V 32 L 16 36 H 40 L 36 32 V 25 C 36 20 33 17 28 17 Z" fill="#FFFFFF" />
    <circle cx="28" cy="39" r="2.5" fill="#FFFFFF" />
    <circle cx="44" cy="14" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>